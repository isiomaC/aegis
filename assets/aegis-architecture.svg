<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1125" viewBox="0 0 1800 1125" role="img" aria-labelledby="title desc">
  <title id="title">Aegis Fleet zero-trust architecture</title>
  <desc id="desc">Enterprise agents and dashboard call the Aegis Gateway in Cloud Run. The gateway uses a deterministic policy engine and Gemini 3.5 Flash advisory analysis, then allows, denies, or quarantines actions. Audit data persists in Firestore and security events publish to Pub/Sub.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111b33"/>
      <stop offset="1" stop-color="#1d3769"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#10203f" flood-opacity=".14"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#3b82f6"/></marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#18a77a"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#e45263"/></marker>
    <style>
      .title { font: 700 48px Helvetica; fill: #f8fafc; }
      .subtitle { font: 400 22px Helvetica; fill: #b9c7df; }
      .section { font: 700 17px Helvetica; letter-spacing: 2.5px; fill: #5279c9; }
      .node-title { font: 700 25px Helvetica; fill: #13213b; }
      .node-sub { font: 400 18px Helvetica; fill: #52627c; }
      .small { font: 600 16px Helvetica; fill: #52627c; }
      .label { font: 700 16px Helvetica; fill: #42516a; }
      .footer { font: 500 19px Helvetica; fill: #43536b; }
    </style>
  </defs>

  <rect width="1800" height="1125" fill="#f8fafc"/>
  <rect x="45" y="35" width="1710" height="155" rx="26" fill="url(#header)"/>
  <text x="100" y="105" class="title">Aegis Fleet — Zero-Trust Agent Control Plane</text>
  <text x="100" y="148" class="subtitle">Every privileged agent action is evaluated, recorded, and contained before execution.</text>
  <rect x="1425" y="75" width="270" height="70" rx="35" fill="#163e70" stroke="#4f9cf9" stroke-width="2"/>
  <text x="1560" y="118" text-anchor="middle" style="font:700 19px Helvetica;letter-spacing:1.5px;fill:#8ec2ff;">CLOUD RUN</text>

  <text x="90" y="250" class="section">REQUESTS</text>
  <g filter="url(#shadow)">
    <rect x="90" y="280" width="300" height="150" rx="20" fill="#fff" stroke="#d6e0ef" stroke-width="2"/>
    <circle cx="145" cy="338" r="30" fill="#e8f0ff"/>
    <path d="M132 344h26v12h-26zM137 327h16v17h-16z" fill="#386bd5"/>
    <text x="190" y="332" class="node-title">Enterprise agents</text>
    <text x="190" y="365" class="node-sub">Privileged tool requests</text>
    <text x="190" y="394" class="node-sub">Payments · data · operations</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="90" y="500" width="300" height="130" rx="20" fill="#fff" stroke="#d6e0ef" stroke-width="2"/>
    <circle cx="145" cy="557" r="30" fill="#e8f0ff"/>
    <rect x="128" y="538" width="34" height="25" rx="3" fill="#386bd5"/>
    <rect x="137" y="568" width="16" height="4" rx="2" fill="#386bd5"/>
    <text x="190" y="555" class="node-title">React dashboard</text>
    <text x="190" y="588" class="node-sub">Live security posture + demo</text>
  </g>

  <path d="M390 355 H500" stroke="#3b82f6" stroke-width="5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M390 565 H500" stroke="#3b82f6" stroke-width="5" fill="none" marker-end="url(#arrow-blue)"/>

  <text x="515" y="250" class="section">ZERO-TRUST GATEWAY</text>
  <g filter="url(#shadow)">
    <rect x="500" y="280" width="390" height="350" rx="24" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
    <rect x="530" y="315" width="330" height="68" rx="14" fill="#2563eb"/>
    <text x="695" y="358" text-anchor="middle" style="font:700 27px Helvetica;fill:#fff;">Aegis Gateway</text>
    <text x="695" y="414" text-anchor="middle" class="node-title">Hono API + Zod contracts</text>
    <line x1="540" y1="447" x2="850" y2="447" stroke="#bfdbfe" stroke-width="2"/>
    <text x="560" y="486" class="small">1. Identify agent + requested action</text>
    <text x="560" y="524" class="small">2. Enforce policy + assess risk</text>
    <text x="560" y="562" class="small">3. Record evidence + publish event</text>
    <text x="560" y="600" class="small">4. Execute, block, or quarantine</text>
  </g>

  <text x="1005" y="250" class="section">EVALUATION LAYERS</text>
  <g filter="url(#shadow)">
    <rect x="1005" y="280" width="320" height="150" rx="20" fill="#fff" stroke="#a9c8ff" stroke-width="2"/>
    <rect x="1035" y="310" width="94" height="32" rx="16" fill="#dbeafe"/>
    <text x="1082" y="332" text-anchor="middle" style="font:700 14px Helvetica;fill:#2254a1;">AUTHORITATIVE</text>
    <text x="1035" y="375" class="node-title">Policy engine</text>
    <text x="1035" y="408" class="node-sub">Limits · vendors · tools · status</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1005" y="500" width="320" height="150" rx="20" fill="#fff" stroke="#8edcc8" stroke-width="2"/>
    <rect x="1035" y="530" width="78" height="32" rx="16" fill="#d8f7ed"/>
    <text x="1074" y="552" text-anchor="middle" style="font:700 14px Helvetica;fill:#087a5a;">ADVISORY</text>
    <text x="1035" y="595" class="node-title">Gemini 3.5 Flash</text>
    <text x="1035" y="625" class="node-sub">Google ADK + Vertex AI (global)</text>
  </g>
  <path d="M890 355 H995" stroke="#3b82f6" stroke-width="5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M890 555 H995" stroke="#3b82f6" stroke-width="5" fill="none" marker-end="url(#arrow-blue)"/>

  <text x="1440" y="250" class="section">DECISION</text>
  <g filter="url(#shadow)">
    <rect x="1440" y="365" width="270" height="180" rx="24" fill="#fff" stroke="#d6e0ef" stroke-width="2"/>
    <text x="1575" y="413" text-anchor="middle" class="node-title">Decision</text>
    <rect x="1470" y="440" width="210" height="32" rx="16" fill="#d8f7ed"/>
    <text x="1575" y="463" text-anchor="middle" style="font:700 16px Helvetica;fill:#087a5a;">ALLOW</text>
    <rect x="1470" y="485" width="210" height="32" rx="16" fill="#ffe1e5"/>
    <text x="1575" y="508" text-anchor="middle" style="font:700 16px Helvetica;fill:#b4233d;">DENY / QUARANTINE</text>
  </g>
  <path d="M1325 355 H1405 V410 H1430" stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow-slate)"/>
  <path d="M1325 575 H1405 V500 H1430" stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow-slate)"/>

  <g filter="url(#shadow)">
    <rect x="1395" y="650" width="315" height="125" rx="20" fill="#effcf7" stroke="#8edcc8" stroke-width="2"/>
    <text x="1425" y="700" class="node-title">Protected action</text>
    <text x="1425" y="733" class="node-sub">Simulated enterprise tool</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1395" y="825" width="315" height="130" rx="20" fill="#fff1f2" stroke="#f6abb6" stroke-width="2"/>
    <text x="1425" y="875" class="node-title">Containment</text>
    <text x="1425" y="908" class="node-sub">Incident + agent quarantine</text>
  </g>
  <path d="M1575 545 V635" stroke="#18a77a" stroke-width="5" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M1575 545 V810" stroke="#e45263" stroke-width="5" fill="none" marker-end="url(#arrow-red)"/>
  <text x="1595" y="600" class="label" fill="#087a5a">allow</text>
  <text x="1595" y="770" class="label" fill="#b4233d">deny</text>

  <text x="90" y="730" class="section">EVIDENCE + EVENTS</text>
  <g filter="url(#shadow)">
    <rect x="90" y="760" width="355" height="170" rx="20" fill="#fff" stroke="#c9d4e5" stroke-width="2"/>
    <text x="125" y="812" class="node-title">SHA-256 audit chain</text>
    <text x="125" y="847" class="node-sub">Tamper-evident action ledger</text>
    <text x="125" y="883" class="node-sub">Each record links to prior hash</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="540" y="760" width="340" height="170" rx="20" fill="#fff" stroke="#f3c675" stroke-width="2"/>
    <text x="575" y="812" class="node-title">Firestore</text>
    <text x="575" y="847" class="node-sub">Agents · actions · incidents</text>
    <text x="575" y="883" class="node-sub">Durable audit evidence</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="975" y="760" width="350" height="170" rx="20" fill="#fff" stroke="#d8bcff" stroke-width="2"/>
    <text x="1010" y="812" class="node-title">Pub/Sub</text>
    <text x="1010" y="847" class="node-sub">Typed security events</text>
    <text x="1010" y="883" class="node-sub">Allow · deny · quarantine</text>
  </g>
  <path d="M620 630 V710 H268 V745" stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow-slate)"/>
  <path d="M695 630 V745" stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow-slate)"/>
  <path d="M770 630 V710 H1150 V745" stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow-slate)"/>
  <text x="470" y="702" class="label">hash audit record</text>
  <text x="717" y="710" class="label">persist</text>
  <text x="930" y="702" class="label">publish event</text>

  <line x1="90" y1="1010" x2="1710" y2="1010" stroke="#dbe4f0" stroke-width="2"/>
  <text x="900" y="1065" text-anchor="middle" class="footer">Cloud Run (europe-west1) hosts the dashboard and gateway. Gemini 3.5 Flash is called through Vertex AI’s global endpoint.</text>
</svg>
